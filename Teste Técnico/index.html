<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Boleto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container-fluid nav">
        <div class="row">
            <div class="col-12">
                <p>a</p>
            </div>
        </div>
    </div>

    <div class="container">

        <div class="row d-flex justify-content-center">

            <div class="col-12 col-form">

                <form action="" id="boletoform">
                     <h1 class="text-center">Consultar Boleto</h1>
                    <div class="container ">
                        <div class="row ">
                            <div class="col-12 d-flex justify-content-center">
                                <label for="codigo" class="label-form ">Insira o código do boleto:</label>
                            </div>
                            <div class="col-12 d-flex justify-content-center">
                                <input type="text" name="" id="codigo" maxlength="7" minlength="7" pattern="[0-9]{7}" inputmode="numeric" autocomplete="off" required class="campo-form">
                            </div>
                            <div class="col-12 d-flex justify-content-center">
                             <p id="mensagem" role="status" aria-live="polite"></p>
                            </div>
                            <div class="col-12 d-flex justify-content-center">
                                 <input type="submit" value="Validar boleto" class="validar-botao">
                            </div>
                        </div>
                    </div>
                </form>

            </div>
   

       
            <div class="col-12 dados-busca" hidden id="resumo">
                
                <div class="container ">
                    
                    <div class="row">

                        

                        <div class="col-12 d-flex justify-content-center">
                            <section>
                                <h2>Resumo do boleto</h2>

                                <p class="text-center" class="dado">Beneficiário: <span id="beneficiario"></span></p>
                                <p class="text-center" class="dado">Vencimento: <span id="vencimento"></span></p>
                                <p class="text-center" class="dado">Valor: <span id="valor"></span></p>
                                <p class="text-center" class="dado">Status: <span id="status"></span></p>

                                <p class="text-center"><button type="button" id="btnPagar" class="pagamento-botao text-center">
                                    Simular pagamento
                                </button></p>

                                <p id="mensagemPagamento" role="status" aria-live="polite"></p>
                            </section>
                        </div>

                    </div>

                </div>
                 
            </div>

        </div>
    </div>
    <script src="js/api.js"></script>
</body>
</html>
